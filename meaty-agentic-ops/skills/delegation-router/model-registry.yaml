# ──────────────────────────────────────────────────────────────────────────────
# Global Model Registry (model-first)
#
# PURPOSE
#   The single authoritative source of truth for EVERY model × every provider the
#   delegation-router can reach. Folds in three previously-fragmented sources:
#     - .claude/config/provider-plugins.toml  (provider-first invocation mechanics)
#     - .claude/config/multi-model.toml        (task-class defaults + cost-shift policy)
#     - ~/.claude/skills/ica-delegate/references/ica-models.md  (ICA prose inventory)
#
#   This file is model-keyed: each model carries its provider sub-instances. The
#   resolver reads this registry directly (or a derived in-memory structure) and
#   honors `enabled`, `priority`, `allowance`, and the `routing_policy` chains.
#   A model may also declare `allowed_dispatch_lanes`; when present, dispatchers
#   must refuse every lane not named there before launching a provider.
#
#   THIS IS THE AUTHORITATIVE SOURCE. Provider-plugins.toml / multi-model.toml
#   routing tables are derived from / reconciled against this file.
#
# ADDING A NEW MODEL ON RELEASE
#   Add a `models:` entry with `status: scaffolded` and every provider instance
#   `enabled: false` until capabilities are confirmed. Registering it lets agents
#   know the model exists without auto-routing real work to it. Promote to
#   `status: active` + `enabled: true` only after the model is trusted.
#
# CRITICAL ACCURACY INVARIANT (do not assume — encode it)
#   ICA "free" (`allowance: unlimited`, $0, cost-shifted off the primary budget)
#   applies to: claude-haiku-4-5, gemma-4-26b, llama-4-maverick, granite-4-small, AND
#   (as of 2026-08-26, Nick authoritative) gpt-5.6-luna — FIVE models, not four. (ICA ccx id
#   `gpt-5.6-luna`; the beta alias `gpt-5.6-luna-dzus` was retired 2026-09-22 with the beta keys.)
#   Any doc/note still saying "exactly 4" is stale.
#   ⚠️ 2026-10-07 RE-PROBE (node_01M4C1MXHVCZTA6Y71RNEVXT4R): Nick reports claude-haiku-4-5 is no
#   longer free on ICA. Measured on key CCx3 / ccx lane: `x-litellm-response-cost-original` is still
#   0.0 for it (n>=12 calls, up to 41.6k input tokens; paid control claude-sonnet-5 reads
#   $0.0093-$0.1496 on the same key). The cumulative `x-litellm-key-spend` header is replica-lagged
#   and cannot settle it; a portal credit read before/after a large Haiku 4.5 call would.
#   ➜ DECISION (Nick, 2026-10-07, "Treat it as paid now"): claude-haiku-4-5 on ICA is PAID. Its ICA
#   provider row is `cost_tier: standard, allowance: shared_token_pool`, cost_score 7, and the
#   free set is now FOUR (gemma-4, llama-4-maverick, granite-4-small, gpt-5.6-luna). The $0.00 meter
#   reading stays recorded as an OPEN DISCREPANCY (tracker: ICA Haiku 4.5 metering shows $0 though Nick
#   reports paid: verify with a portal credit delta, child of node_01M4C1MXHVCZTA6Y71RNEVXT4R).
#   claude-haiku-5-5 is NOT served on ICA (403).
#   Everything else ICA-served is `allowance: shared_token_pool` — token-limited
#   against ICA's shared pool and therefore NOT free. They remain opt-in cost-shifts.
#
# ICA ROUTING RESTATEMENT — 2026-08-28 (documentation-only; no chain/score change here):
#   Prefer ccx / CCx1 (the one focus key for now) for generally eligible ICA work. CCx1 is approximately 2,000 credits/week
#   (~$1,000/week in API credits) plus the independent free-model list above. (2026-09-22: the old
#   beta keys and the beta gateway were DEACTIVATED — ccx is the only ICA lane; the one live key is
#   CCx3 per `ica-key list`. The beta sentence that stood here is archived in agentic_meta_dev
#   infra/dispatch/DEACTIVATED-beta-keys-2026-09-22.md.) `5x` is renamed `1x` as of this date wherever that earlier subscription-key label
#   appears; this tracked registry has no `subscription-5x` row to rename. See MODEL-ROUTING.md
#   Updated 2026-08-28 for the economic order and §1.4 for eligibility.
#
# ICA 1M-CONTEXT PREFERENCE — RETIRED 2026-08-26 (was: "always prefer `[1m]`")
#   ⚠️ INVERTED, not softened. Measured 2026-08-26 across both gateways (beta + ccx)
#   and all 11 keys: every `[1m]`/dated model id now 403s on EVERY transport,
#   including the Claude Code client path that used to be the one place it worked.
#   USE BARE IDS EVERYWHERE. Bare ids now carry NATIVE (not 200k-capped) context —
#   measured via usage.prompt_tokens: bare claude-sonnet-5 = 600,007 tokens on beta,
#   950,007 on ccx; bare gemini-3.7-flash = 950,002 on ccx; bare gpt-5.6-sol =
#   600,007 on ccx; bare claude-haiku-4-5 = 190,008 accepted / 250,000 rejected
#   (that ceiling is Haiku's own real 200k limit, not a gateway cap). Nothing is
#   lost by dropping the suffix. Do not reintroduce `[1m]` on any ICA model id.
#   Full inventory: agentic_meta_dev `docs/agentic-operator/ICA-CCX-LANE-MATRIX.md`;
#   findings: `docs/audits/ica-lane-findings-2026-08-26.md`.
#
#   The paragraph below is the RETIRED doctrine, kept for history (do not delete —
#   it explains why every provider row below used to carry a `[1m]` suffix):
#   > For ICA-served Claude Opus/Sonnet AND ICA-served Gemini, the `[1m]` (1M-context)
#   > instance is ALWAYS preferred over the plain 200k instance — same provider, same
#   > shared token pool, strictly larger context window at no extra cost-tier. The `[1m]`
#   > instance therefore carries the LOWER `priority` number (preferred); the plain
#   > 200k instance is kept only as a demoted fallback. opus-4-8 on ICA is 1m-only.
#   > Re-confirmed for claude-opus-5 on 2026-07-31 ([1m]=1000000, plain=200000).
#   > The `[1m]` suffix is a CLAUDE CODE CLIENT-SIDE hint, NOT a real gateway model id.
#   > It only works through the Claude Code client (ica-claude.sh / ANTHROPIC_MODEL). Raw
#   > transports (/v1/messages, /chat/completions) MUST send the plain id — sending a `[1m]`
#   > id there returns 403 `team_model_access_denied` ("can only access models=['global-models']"),
#   > which is easy to misread as "no access to this model at all". Verified 2026-07-31.
#   > The gateway silently caps the plain id at 200k even for models that are natively
#   > 1M (Sonnet 5, Gemini 3.x) — the `[1m]` suffix is what unlocks the full window on
#   > the ICA path. (NOT needed on the NATIVE gemini-cli path: those models are 1M
#   > natively, no suffix.) Verified via `modelUsage.<id>.contextWindow` 2026-06-09
#   > (Claude) and 2026-07-08 (sonnet-5[1m]=1M/plain=200k; gemini-3.5-flash[1m]=1M/
#   > plain=200k; gemini-3.1-pro-preview[1m]=1M/plain=200k).
#
# ICA OPUS — RETRACTED 2026-08-26 (was: "claude-opus-5[1m] = verified spine-offload lane")
#   ⚠️ THERE IS NO ICA OPUS LANE. claude-opus-5 / claude-opus-4-8 / claude-opus-4-6
#   return 403 on ALL 11 keys (CC1-CC8, BB1, CCx1-CCx3), on BOTH gateways — while
#   claude-sonnet-5 returns 200 on those exact same keys, which is what makes this
#   an Opus-SPECIFIC tenancy entitlement rather than auth, key exhaustion, or the
#   retired `[1m]` rule. ALL FOUR `ica/claude-opus-*` provider rows below are
#   `enabled: false`. This SUPERSEDES the 2026-07-31 "verified spine-offload lane"
#   entry in the changelog below — that lane is dead. Escalate off-ICA to the
#   subscription Opus 5 instead. Re-probe with `ica-key verify <NAME> --model
#   claude-opus-5` before ever re-enabling a row here.
#
# SCORECARD: scores{cost,intelligence,taste,speed} mirror MODEL-ROUTING.md §1.5 (agentic_meta_dev). Higher=better; cost=real spend on the preferred lane; per-provider cost_score overrides where lanes differ. Update doc and registry together.
#
# Reference: docs/project_plans/design-specs/model-registry-router-globalization-v1.md §3
# ──────────────────────────────────────────────────────────────────────────────

