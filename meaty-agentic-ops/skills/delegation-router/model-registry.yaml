# ──────────────────────────────────────────────────────────────────────────────
# Global Model Registry (model-first)
#
# PURPOSE
#   The single authoritative source of truth for EVERY model × every provider the
#   delegation-router can reach. Folds in three previously-fragmented sources:
#     - .claude/config/provider-plugins.toml  (provider-first invocation mechanics)
#     - .claude/config/multi-model.toml        (task-class defaults + cost-shift policy)
#     - ~/.claude/skills/ica-delegate/references/ica-models.md  (ICA prose inventory)
#
#   This file is model-keyed: each model carries its provider sub-instances. The
#   resolver reads this registry directly (or a derived in-memory structure) and
#   honors `enabled`, `priority`, `allowance`, and the `routing_policy` chains.
#
#   THIS IS THE AUTHORITATIVE SOURCE. Provider-plugins.toml / multi-model.toml
#   routing tables are derived from / reconciled against this file.
#
# ADDING A NEW MODEL ON RELEASE
#   Add a `models:` entry with `status: scaffolded` and every provider instance
#   `enabled: false` until capabilities are confirmed. Registering it lets agents
#   know the model exists without auto-routing real work to it. Promote to
#   `status: active` + `enabled: true` only after the model is trusted.
#
# CRITICAL ACCURACY INVARIANT (do not assume — encode it)
#   ICA "free" (`allowance: unlimited`, $0, cost-shifted off the primary budget)
#   applies ONLY to: claude-haiku-4-5, gemma-4-26b, llama-4-maverick, granite-4-small.
#   ICA Sonnet / Opus / GPT / Gemini are `allowance: shared_token_pool` — token-limited
#   against ICA's shared pool and therefore NOT free. They remain opt-in cost-shifts.
#
# ICA 1M-CONTEXT PREFERENCE (do not regress)
#   For ICA-served Claude Opus/Sonnet AND ICA-served Gemini, the `[1m]` (1M-context)
#   instance is ALWAYS preferred over the plain 200k instance — same provider, same
#   shared token pool, strictly larger context window at no extra cost-tier. The `[1m]`
#   instance therefore carries the LOWER `priority` number (preferred); the plain
#   200k instance is kept only as a demoted fallback. opus-4-8 on ICA is 1m-only.
#   The gateway silently caps the plain id at 200k even for models that are natively
#   1M (Sonnet 5, Gemini 3.x) — the `[1m]` suffix is what unlocks the full window on
#   the ICA path. (NOT needed on the NATIVE gemini-cli path: those models are 1M
#   natively, no suffix.) Verified via `modelUsage.<id>.contextWindow` 2026-06-09
#   (Claude) and 2026-07-08 (sonnet-5[1m]=1M/plain=200k; gemini-3.5-flash[1m]=1M/
#   plain=200k; gemini-3.1-pro-preview[1m]=1M/plain=200k). When adding or editing any
#   ICA Opus/Sonnet/Gemini instance, keep the `[1m]` variant ranked first.
#
# SCORECARD: scores{cost,intelligence,taste,speed} mirror MODEL-ROUTING.md §1.5 (agentic_meta_dev). Higher=better; cost=real spend on the preferred lane; per-provider cost_score overrides where lanes differ. Update doc and registry together.
#
# Reference: docs/project_plans/design-specs/model-registry-router-globalization-v1.md §3
# ──────────────────────────────────────────────────────────────────────────────

version: 1
updated: 2026-07-20   # REVERTED the earlier same-day gpt-5.6-*-dzus ICA additions: those ICA gateway ids are listed on the gateway but NOT reliably servable (load-balanced onto a misconfigured deployment → 'LLM Provider NOT provided'; ~/ica-claude.sh masked it via Opus fallback). code_review restored to codex/gpt-5.6-terra first. Parked design + retry trigger: docs/project_plans/implementation_plans/features/ica-codex-responses-shim-v1.md. Prior (2026-07-09): Codex gpt-5.6 line added; code_review chain → codex/gpt-5.6-terra; gpt-5.5/-pro demoted. Effort ladder Light|Medium|High|Extra High(=low|medium|high|xhigh) + Ultra(=ultra, Sol/Terra only). ICA Sonnet 5 reasoning caveat. Prior (2026-07-08): ICA serves Sonnet 5 (claude-sonnet-5[1m]=1M) + [1m] preference extends to Gemini.

# ──────────────────────────────────────────────────────────────────────────────
# Task-class → ordered preference chain. The chain IS the priority / free-first
# mapping: entries are "provider/model_id", tried top-down. Free-eligible classes
# start at a free ICA instance; orchestration / mode_d pin to primary Claude.
# ──────────────────────────────────────────────────────────────────────────────
routing_policy:
  exploration:      { chain: ["ica/claude-haiku-4-5", "claude/claude-haiku-4-5"], enabled: true }
  documentation:    { chain: ["ica/claude-haiku-4-5", "claude/claude-haiku-4-5"], enabled: true }
  mechanical:       { chain: ["ica/claude-haiku-4-5", "ica/gemma-4-26b-a4b-it", "claude/claude-haiku-4-5"], enabled: true }
  second_opinion:   { chain: ["ica/gemma-4-26b-a4b-it", "ica/gemini-3.5-flash[1m]", "ica/meta-llama/llama-4-maverick-17b-128e-instruct-fp8", "ica/claude-haiku-4-5"], enabled: true }
  implementation:   { chain: ["claude/claude-sonnet-5"], enabled: true }   # workhorse default; ICA claude-sonnet-5[1m] = explicit opt-in free-offload for bounded waves (shared pool, behind reviewer gate; supersedes the older ICA Sonnet 4.6 offload)
  web_research:     { chain: ["gemini/gemini-3.5-flash", "ica/gemini-3.1-pro-preview[1m]"], enabled: true }   # leg1 native = Google-Search GROUNDED (needs GEMINI_API_KEY in ~/.config/aos/secrets.env; verified on free-tier key). leg2 ICA = DEGRADED ungrounded fallback (proxy can't ground). Free model-agnostic web lane = aos-web (SearXNG) — prefer for plain search; this chain = fused search+reason.
  code_review:      { chain: ["codex/gpt-5.6-terra", "claude/claude-sonnet-5"], enabled: true }   # codex workhorse = gpt-5.6-terra (successor to gpt-5.5); escalate to gpt-5.6-sol (frontier SOTA) on two failures per the two-failure rule. (An ICA gpt-5.6-terra-dzus lane was attempted 2026-07-20 but reverted — model not reliably servable on the gateway; see ica-codex-responses-shim-v1.md.)
  image_generation: { chain: ["nano-banana/nano-banana-2", "nano-banana/nano-banana-pro"], enabled: true }
  svg_generation:   { chain: ["gemini/gemini-3.5-flash"], enabled: true }
  video_generation: { chain: ["sora/sora-2"], enabled: true }
  orchestration:    { chain: ["claude/claude-opus-4-8"] }   # MUST-stay
  mode_d:           { chain: ["claude/claude-opus-4-8"] }   # MUST-stay

# Invariant: these classes can never be routed off primary Claude, regardless of
# registry state. Enforced unconditionally by the resolver MUST-stay override.
must_stay_primary: [orchestration, verdict, mode_d, council_review, synthesis]

