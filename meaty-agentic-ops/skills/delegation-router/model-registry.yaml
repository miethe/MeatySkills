# Additive registry metadata. The v3 RoutingRecord shape is unchanged.
routing_attributes:
  health:
    statuses: [available, degraded, unavailable, unknown]
    selection_rule: "Health is a hard gate before advisory scores: status=unavailable or quota_limit=0 requires enabled=false. Missing health is unknown, never evidence of availability."
  write_capability:
    codex_sandbox:
      read_class: read_only
      write_class: workspace_write
      write_contract: "A write artifact requires requires_write=true and an explicit write-class invocation; a read-class Codex leg cannot produce its own file artifact."
  lane_eligibility:
    required: [compute_custody, retention, jurisdiction, account_relationship]
    unknown_rule: "unknown fails closed for disclosure_absolute and authority_absolute; it never authorizes a protected chain."

