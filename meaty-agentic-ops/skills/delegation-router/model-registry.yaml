e stays `claude-sonnet-5[1m]` until ICA adds it, and until then ICA's preferred Claude model is `claude-opus-5-5[1m]` (see that model's ICA provider row), not Sonnet 5. Tracker `node_01M3MWZ6564YV32VCMMGAV5DN2` (tree tree_01KVTH95ETM8YRYCV2ENHVR124, 'Update ICA Sonnet mapping to 5.5 when ICA serves it'); probe = a bare-id HTTP 200 check against the ICA gateway (see `ica-ccx-bare-ids-only` lesson) with model_id `claude-sonnet-5-5` (not `[1m]`)."
