# LEGACY COMPATIBILITY KEY — superseded by `task_class_sovereignty` below.
# Retained because foreign/older registries (per-project overrides, test fixtures, the copies
# frozen into workflow-sets/) still carry only this key; for those the resolver desugars each
# entry to {min_rung: subscription, reason: quality_bar}, and a registry with NO `lanes:` table
# at all keeps the pre-ladder behavior verbatim (claude, which is strictly narrower than
# `>= subscription`). THIS registry declares its floors explicitly below and does not rely on
# the desugar — the widening from "claude specifically" to "any subscription lane" must be
# visible in a diff, not arrive as a side effect.
must_stay_primary: [orchestration, verdict, mode_d, council_review, synthesis]

# ──────────────────────────────────────────────────────────────────────────────
# THE SOVEREIGNTY LADDER
#
#   local          (highest)  runs on our own hardware; nothing leaves the LAN
#   subscription              an account we control and pay for directly (Claude sub, Codex sub)
#   shared_gateway (lowest)   third-party-mediated shared pool (ICA)
#
# A task class declares a MINIMUM RUNG, never a named vendor or model.
# "verdict requires >= subscription" REPLACES "verdict pins to subscription Claude" — a Codex
# subscription then satisfies it with no rule naming a vendor.
#
# ⚠️ INVARIANT — THE CLASS BELONGS TO THE LANE, NEVER TO A VENDOR OR A MODEL ID.
# Codex reached THROUGH the shared ICA gateway is NOT a Codex subscription: `codex/gpt-5.6-terra`
# and `ica/gpt-5.6-terra` are the same weights on different sovereignty (same id, two lanes). This estate has
# already been bitten by treating a model-id SUFFIX (`[1m]`) as a lane marker; the resolver reads
# the DECLARED `lane:` on each provider instance and never pattern-matches an id.
#
# ⚠️ THE `local` RUNG HAS ZERO MEMBERS TODAY. Declared deliberately, and named here rather than
# discovered later (`.claude/rules/built-lane-no-writers.md`): no ollama/vLLM/local-inference lane
# exists in this registry. A class declaring `min_rung: local` is therefore UNROUTABLE and the
# resolver REFUSES rather than dropping a rung — which is the correct fail-closed outcome for an
# egress rule, and is why `journal_reflect` below is written the way it is.
# ──────────────────────────────────────────────────────────────────────────────
sovereignty_ladder: [shared_gateway, subscription, local]   # ascending

# A LANE is an ENDPOINT + AUTH unit. It is the thing sovereignty attaches to. Before this table
# there was no lane concept in the registry at all — only a bare `provider:` string — and the
# actual endpoint was selected by REGEXing the model id inside buildRegistryInvocation()
# (`/-dzus$/` -> ica-codex.sh, `/gpt/` -> ica-gpt.sh, else ica-claude.sh). The three ICA rows
# below are exactly those three branches, so this table is grounded in the invocation code
# rather than in the ids. (2026-09-24: the `-dzus` branch is gone with the retired beta aliases;
# the ica-codex.sh branch now keys off `lane: ica_gateway_responses_shim`, not an id suffix.)
lanes:
  claude_subscription:
    sovereignty: subscription
    endpoint: anthropic_default          # ANTHROPIC_BASE_URL unset
    auth: anthropic_oauth_subscription
    invocation: "claude -p"
    note: >-
      The lane discriminator is ANTHROPIC_BASE_URL, never the model id. A native subscription
      session legitimately reports a `[1m]` model id; that suffix is a context-window marker.

  ica_gateway_messages:
    sovereignty: shared_gateway
    endpoint: ica_gateway_messages       # ANTHROPIC_BASE_URL = the ICA gateway
    auth: ica_team_key                   # ~/.dotfiles/ICA_CLAUDE
    invocation: "~/ica-claude.sh"

  ica_gateway_messages_shim:
    sovereignty: shared_gateway
    endpoint: ica_gateway_messages_via_param_strip_proxy
    auth: ica_team_key
    invocation: "~/ica-gpt.sh"
    note: >-
      Azure-backed GPT deployments on the gateway reject Claude Code's output_config; this lane
      is the local param-strip proxy in front of the same shared gateway. Same sovereignty.

  ica_gateway_responses_shim:
    sovereignty: shared_gateway
    endpoint: ica_gateway_via_local_responses_to_chat_shim
    auth: ica_team_key
    invocation: "~/ica-codex.sh"
    note: >-
      Codex driven against a LOCAL shim that fronts the SHARED gateway. The local hop does not
      make it local: the tokens are still served by the third-party shared pool. This row is the
      concrete case invariant 2 exists for.

  codex_subscription:
    sovereignty: subscription
    endpoint: openai_default
    auth: codex_account
    invocation: "codex exec"
    verified: false
    probe: >-
      UNCONFIRMED, and this is the load-bearing open question of the ladder. Classified
      `subscription` because the brief names "Codex sub" as satisfying that rung — but every
      codex row in this file carries `allowance: billed`, which reads as a metered API account
      rather than a seat. It decides whether `verdict` widens to codex at all. Ask Nick; this is
      a definitional call, not a measurement.

  gemini_direct:
    sovereignty: subscription
    endpoint: google_ai_studio
    auth: gemini_api_key                 # ~/.config/aos/secrets.env
    verified: false
    probe: >-
      UNCONFIRMED, same shape as codex_subscription: a direct metered API key on an account we
      control, not a seat. No class currently declares a floor that would route here, so the
      classification is not yet load-bearing. Ask Nick alongside codex.

  bob_ibm_shell:
    sovereignty: unknown
    endpoint: unknown
    auth: unknown
    invocation: "bob -p"
    verified: false
    probe: >-
      DELIBERATELY UNCLASSIFIED — the evidence contradicts itself and `unknown` clears no floor,
      which is the fail-closed answer. The registry entry says `family: local` / `allowance:
      local`, but the `bob-shell-delegate` skill describes it as the IBM Bob Shell CLI, i.e.
      IBM-hosted. `allowance: local` most likely means "a locally-run CLI binary", which is a
      statement about where the PROCESS runs, not where INFERENCE runs — and inference is what
      sovereignty is about. PROBE: run `bob` with the network down, or inspect ~/.config/bob* for
      a gateway URL + credential. Do not classify it from the `allowance` field.

  nano_banana_api:
    sovereignty: unknown
    endpoint: unknown
    auth: unknown
    verified: false
    probe: >-
      Never classified; has no branch in buildRegistryInvocation() either. No floored class routes
      to image generation today, so `unknown` costs nothing and asserts nothing.

  sora_api:
    sovereignty: unknown
    endpoint: unknown
    auth: unknown
    verified: false
    probe: Same as nano_banana_api — unclassified, and no floored class reaches it.

  external_candidate:
    sovereignty: unknown
    endpoint: unknown
    auth: unknown
    verified: false
    probe: >-
      Shared lane for the M5b external-provider candidates below (deepseek-v4-flash, qwen3-flash,
      kimi-k2, glm, grok) — all `status: candidate`, `enabled: false`, `executor_status: absent`.
      Same shape as bob/nano-banana/sora: unclassified on purpose, and no floored class routes to
      any of them today, so `unknown` costs nothing and asserts nothing.

# ──────────────────────────────────────────────────────────────────────────────
# TASK CLASS → MINIMUM RUNG. `reason` is REQUIRED and the resolver THROWS without a valid one
# (validateSovereigntyDeclarations) — a registry with an unreasoned minimum does not load.
#
#   cost_policy      negotiable; a tuning pass may revisit it
#   quality_bar      negotiable on evidence
#   egress_absolute  NOT negotiable by ANY automated, empirical, or feedback path
#
# WHY THE REASON IS MANDATORY: "stay off the shared gateway for the verdict" is a cost/quality
# judgement; "stay local for the private journal" is an EGRESS rule with no sign-off path at all.
# If both were merely "a minimum rung" a future cost-tuning pass could not tell them apart, and
# the one it would relax is the privacy boundary.
#
# ⚠️ MIGRATION NOTE — THIS IS A DELIBERATE WIDENING, WRITTEN OUT SO IT IS VISIBLE.
