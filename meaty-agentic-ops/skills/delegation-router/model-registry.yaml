  # ── Frontier (Claude Fable 5 — Mythos-class; 2× Opus cost; EXPLICIT OPT-IN ONLY) ─────
  #
  # Fable 5's lead over Opus 4.8 GROWS with task length/complexity and ≈ 0 on short/routine
  # work — so its 2× premium ($10/$50 vs Opus $5/$25 per M) only pays where the task is
  # high-leverage, path-dependent, or one-shots what Opus would take many cycles to do.
  # Deliberately NOT in any routing_policy chain and NOT in must_stay_primary: it is reached
  # ONLY by an explicit `model: claude-fable-5` assignment, so it is never spent by default.
  #
  # WHEN IT EARNS THE 2× (assign it in plan frontmatter, or set it as the SESSION orchestrator
  # model during planning/decomposition phases):
  #   • Pre-commitment planning & architecture — PRDs, impl plans, ExecutionGraph design,
  #     spike/exploration verdict synthesis. Authored once; constrains dozens of downstream
  #     agent-hours, so a better decision dwarfs the token premium. (HIGHEST ROI.)
  #   • Net-new / greenfield jumpstarts — initial schema, domain model, system shape. Max
  #     uncertainty + path-dependency; early decisions compound for weeks. (Cross-project:
  #     MeatyWiki / CityTiles / IntentTree foundations, not just SkillMeat.)
  #   • Long-horizon autonomous sprints — large migrations / broad sweeps run unattended
  #     (Tier 3 only). Premium is dwarfed by the cost of an off-the-rails multi-hour run.
  #   • Escalated debugging — AFTER Opus has failed 1–2 cycles; one strong pass beats N more.
  #   • High-stakes verdict gates — final sign-off on core-path / auth / migration work where
  #     a wrong "done" ships a regression.
  #
  # WHEN NOT TO USE IT (Opus 4.8 is the sensible baseline — Fable's edge ≈ 0):
  #   routine implementation (Sonnet/Opus already strong) · high-volume mechanical work
  #   (→ Haiku/ICA, free) · latency-sensitive interactive loops · tight iterate-many-times
  #   loops · anything you run dozens of times where 2× compounds.
