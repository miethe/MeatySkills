# ⚠️ v2 (2026-10-08): DERIVED from `task_class_defaults` (below) — resolver.js reads the holders there first;
# this block stays for older readers (routing.local.toml overrides, frozen workflow-set copies, CCDash) and
# build-model-registry.py refuses a registry where a chain and its class's holders disagree.
# Task-class → ordered preference chain. The chain IS the priority / free-first
# mapping: entries are "provider/model_id", tried top-down. Free-eligible classes
# start at a free ICA instance; orchestration / mode_d pin to primary Claude.
# ──────────────────────────────────────────────────────────────────────────────
routing_policy:
  # 2026-10-07 (Nick): the native/subscription Haiku leg is now claude-haiku-5-5 (10x cheaper than 4.5, native 1M ctx;
  # blind bench mean 4.33 vs 3.83/5). ICA Haiku 4.5 now counts as PAID (Nick, "Treat it as paid now"), so the free ICA leg
  # is gpt-5.6-luna (rule a: still-free ICA model; bench: luna(low) 5.00/5 via Codex, ICA /v1/messages 200 at cost 0.0),
  # with Haiku 5.5 on the subscription as the fallback (rule b). Haiku 4.5 remains selectable explicitly.
  # 2026-10-07 (later), ROLE-BASED REVISION (node_01M4C58QYW0KP7987JWADP8YKV). Nick: "We shouldn't be relegating Haiku 5.5 automatically as a
  # fallback ... rather compare it with GPT-6 Luna as our paid ones ... holding a different role than the free 5.6 Luna
  # from ICA." Chains below are ordered by who OWNS the class, not by price:
  # - exploration: Haiku 5.5 OWNS it. Exploration runs as Claude Code's native Explore/subagent path and reads repos whose
  #   disclosure is unknown at dispatch (most AOS repos are private, and ICA is the employer lane, never for private or
  #   CHCW material; unknown fails closed for a disclosure_absolute minimum). Haiku is the fastest single call measured
  #   (1.6 s trivial wall, ~167 tok/s, a 464K-token prefill in 4 s) and scored 8/8 on a 161K-token retrieval. ICA Luna
  #   stays as the free leg for exploration a caller knows is public; GPT-6 Luna is the cross-family paid peer.
  # - documentation / mechanical: ICA GPT-5.6 Luna OWNS free bulk work on PUBLIC content (it passed every agentic and
  #   schema task in the bench, slowest arm). The paid peers follow as peers, Haiku 5.5 (Claude harness, fastest) then
  #   GPT-6 Luna (Codex quota, terser), so an ICA miss never lands on a single price-fallback.
  # Not encoded here (needs a task-class vocabulary bump coordinated with CCDash's pinned digest; filed as a follow-up):
  # a `triage` class (Haiku 5.5 first: best blind triage reasoning, 19/19 both reps) and a `long_context_read` class
  # (Sonnet 5.5 first at >=300K: 8/8 vs Haiku 5/8 and ICA Luna 6/8 at 464K tokens; GPT-6 Luna cannot take it in one
  # Codex turn, the CLI caps input at 1,048,576 characters).
  exploration:      { chain: ["claude/claude-haiku-5-5", "ica/gpt-5.6-luna", "codex/gpt-6-luna"], enabled: true }
  documentation:    { chain: ["ica/gpt-5.6-luna", "claude/claude-haiku-5-5", "codex/gpt-6-luna"], enabled: true }
  mechanical:       { chain: ["ica/gpt-5.6-luna", "ica/gemma-4-26b-a4b-it", "claude/claude-haiku-5-5", "codex/gpt-6-luna"], enabled: true }
  # Grounded 2026-07-28; Nick decision 2026-09-25 moves the Codex subscription workhorse to GPT-6 Luna.
  second_opinion:   { chain: ["codex/gpt-6-luna", "ica/gemini-3.6-flash", "ica/gemma-4-26b-a4b-it", "claude/claude-haiku-5-5"], enabled: true }   # 2026-10-07: last-resort leg ica/claude-haiku-4-5 (now paid) -> subscription Haiku 5.5 (rule b). Haiku is last here by ROLE, not price: a second opinion's value is cross-family diversity against the Claude primary, and Haiku is the same family.
  # Grounded 2026-08-09 (execution pilot, n=3; see use-case-rankings.yaml `agentic-coding`, conf 0.5). CHAIN DELIBERATELY UNCHANGED — codex/gpt-5.6-terra shipped 3/3 real legs with zero logic defects but is EXPLICITLY-SELECTABLE ONLY, not an auto leg, on n=3 with no head-to-head arm. Explicit selection already resolves (codex-executor, fallback claude/claude-sonnet-5) and needs no chain edit. ⚠️ Dispatch an implementer leg at effort `high` — sandboxModeFor() maps standard→read-only, so a default-effort codex implementer CANNOT WRITE and fails by producing nothing.
  implementation:   { chain: ["claude/claude-sonnet-5-5", "claude/claude-sonnet-5"], enabled: true }   # 2026-09-28: workhorse default moves to Sonnet 5.5 (native/subscription only — ICA doesn't serve it yet); fallback claude-sonnet-5. ICA claude-sonnet-5[1m] = explicit opt-in free-offload for bounded waves (shared pool, behind reviewer gate; supersedes the older ICA Sonnet 4.6 offload) — update to claude-sonnet-5-5[1m] once ICA serves 5.5. ⚠️ Updated 2026-09-28 (evening) per Nick: this is the CONTRACT-CLEAR execution default, not a blanket one — `design_judgment` (architecture/UX-visual-design/hard-judgment/ambiguous-synthesis) and `raw_strength` (hard-algorithmic/debugging/reasoning-heavy) are separate task classes below and never resolve through this chain.
  # Added 2026-09-28 (evening), Nick: Opus 5.5's real role beyond the orchestration/mode_d spine —
  # design/architecture/UX-visual-design/hard-judgment/ambiguous-synthesis work starts here, not
  # merely as a two-Sonnet-5.5-miss escalation target. Distinct from `orchestration` (MUST-stay,
  # personal-account, verdict/schema-recovery/cross-wave-merge) — this class is not must_stay_primary.
  design_judgment:  { chain: ["claude/claude-opus-5-5", "claude/claude-opus-5"], enabled: true }
  # Added 2026-09-28 (evening), Nick: gpt-6-sol's real role beyond the second_opinion cross-family
  # lens — hard-algorithmic problems, debugging, and reasoning-heavy legs start here, in addition to
  # (not a replacement for) its existing cross-family use in second_opinion above.
  # 2026-09-30, Nick: gpt-6.1-sol supersedes gpt-6-sol as the raw_strength default; gpt-6-sol is the legacy-selectable fallback.
  raw_strength:     { chain: ["codex/gpt-6.1-sol", "codex/gpt-6-sol", "claude/claude-opus-5-5"], enabled: true }
  web_research:     { chain: ["gemini/gemini-3.6-flash", "gemini/gemini-3.5-flash", "ica/gemini-3.1-pro-preview"], enabled: true }   # leg1 native = 3.6-flash Google-Search GROUNDED (newer default, 2026-07-27; needs GEMINI_API_KEY in ~/.config/aos/secrets.env). leg2 = 3.5-flash native (grounded fallback). leg3 ICA = DEGRADED ungrounded fallback (proxy can't ground). Free model-agnostic web lane = aos-web (SearXNG) — prefer for plain search; this chain = fused search+reason.
  code_review:      { chain: ["codex/gpt-6-luna", "claude/claude-sonnet-5-5", "claude/claude-sonnet-5"], enabled: true }   # Codex subscription default = GPT-6 Luna; Claude fallback moves to Sonnet 5.5 (2026-09-28), then legacy Sonnet 5. ⚠️ 2026-09-28 (evening): for a raw-strength review pass (hard algorithmic/debugging/reasoning-heavy), route explicitly to `raw_strength` (codex/gpt-6.1-sol; gpt-6-sol fallback) instead of this chain — this chain is for contract-clear review only.
  # Raster images, mood boards, mock-up renders, illustrations, and PNG assets: native Codex
  # image_gen.imagegen first; use the ICA GPT shim only when already on ICA; Gemini/Nano Banana
  # remains an availability fallback. Native invocation verified from the installed imagegen skill.
  image_generation: { chain: ["codex/gpt-6-luna", "ica/gpt-5.6-terra", "nano-banana/nano-banana-2", "nano-banana/nano-banana-pro"], enabled: true }
  # Grounded 2026-07-28 (pilot; rf_run_20260728_pilot_re_eval_svg_generation_routing), see use-case-rankings.yaml, conf 0.6. Cost/taste trade: frontier leg-1 (claude-fable-5) for final/taste-critical assets, flash tier for drafts/bulk.
  svg_generation:   { chain: ["claude/claude-fable-5-1", "ica/gemini-3.1-pro-preview", "gemini/gemini-3.5-flash", "gemini/gemini-3.6-flash"], enabled: true }
  video_generation: { chain: ["sora/sora-2"], enabled: true }
  # Added 2026-08-27 (node_01M122PQQ86YWJWDA9GT83PBWQ, citing node_01M0Z7JP9YT7W15X94Z843AM9Y).
  # gpt-5.6-sol reasons genuinely on the ICA ccx lane ONLY when NO tool declarations are present
  # (reasoning_tokens=0 the instant a tool is offered, on BOTH /v1/chat/completions and
  # /v1/responses — measured 2026-08-26/27, mutual exclusivity confirmed structural). These three
  # classes are pure-text judgment tasks by definition (nothing here ever calls a tool), so they
  # are safe auto-routes to the tool_mode:"none"-restricted ica/gpt-5.6-sol instance. Deliberately
  # NEW ids, not a repoint of the existing must_stay_primary `verdict`/`council_review`/`synthesis`
  # classes — see resolver.js's TOOL_RESTRICTED gate and SPEC.md § "Tool-less Sol lane".
  review:           { chain: ["ica/gpt-5.6-sol"], enabled: true }
  adjudication:     { chain: ["ica/gpt-5.6-sol"], enabled: true }
  critique:         { chain: ["ica/gpt-5.6-sol"], enabled: true }
  # Contract-only whole-node class. Never inferred from another task class and never a default
