-6 first). gpt-5.6-{terra,luna}-dzus RE-CONFIRMED not dispatchable (/responses Azure api-version 400 both keys; luna's only working path = CODEX key + raw /chat/completions no-effort, unreachable by wired executors) → left documented in the native codex blocks, NO ICA provider rows carried (matches the 2026-07-20 revert). claude-opus-5[1m] RE-PROBED still absent from the gateway → stays disabled; ICA spine-offload remains claude-opus-4-8[1m]. Prior 2026-07-24   # Opus 5 (claude-opus-5) lands as the new SPINE / MUST-stay tier (orchestration + mode_d chains repointed claude-opus-4-8 -> claude-opus-5). Opus 4.8 demoted to legacy (Anthropic moved it to the legacy model list, same $5/$25) but kept selectable + as the ICA claude-opus-4-8[1m] spine-offload fallback (Opus 5 ICA availability unconfirmed -> claude-opus-5[1m] scaffolded/disabled pending a gateway probe). Sonnet 5 stays the default implementation workhorse; added token_economy_note (new tokenizer ~30% more tokens vs 4.6 -> prefer 4.6[1m]/Haiku for bounded/mechanical high-volume fan-out on metered/ICA lanes). Codex gpt-5.6 line (sol/terra/luna) unchanged/current. Prior 2026-07-21   # ICA GPT retest: NEW gpt-5.5-gus works with tools+reasoning on RAW transports (chat/completions, /responses w/ effort-scaling, /messages) on both keys — but 400s via Claude Code (CC's output_config rejected by Azure) → added status:scaffolded/enabled:false pending an output_config-strip path. gpt-5.4-gus + gpt-5.1-chat-gus REGRESSED (not servable on any key/endpoint) → status:degraded/enabled:false. gpt-5.6-*-dzus retest: terra-dzus dead on all routes; luna-dzus works ONLY via CODEX key + /chat/completions + tool + NO reasoning_effort (the strip-reasoning-control-param hypothesis CONFIRMED, narrow path; /responses still api-version-gated). One unifying finding: the ICA Azure-backed GPT deployments reject the client's reasoning-control param (reasoning_effort on chat, output_config on /messages) — strip it and the working models complete (effort defaults server-side). Prior 2026-07-20   # ICA Sonnet 5 reasoning REVALIDATED WORKING via Claude Code (supersedes the 2026-07-09 no-op finding): adaptive thinking + output_config.effort honored end-to-end; legacy thinking.type:enabled now 400s. Reasoning-dependent offload to ica/claude-sonnet-5[1m] is now allowed; only gap = output_config.format (structured JSON) dropped by the gateway → use a tool-call. Gemini 3.5-flash/3.1-pro usable via ICA (/v1/messages + /chat/completions + CC [1m]); reasoning not surfaced as thinking blocks, grounding native-key-only. ALSO REVERTED the earlier same-day gpt-5.6-*-dzus ICA additions: those ICA gateway ids are listed on the gateway but NOT reliably servable (load-balanced onto a misconfigured deployment → 'LLM Provider NOT provided'; ~/ica-claude.sh masked it via Opus fallback). code_review restored to codex/gpt-5.6-terra first. Parked design + retry trigger: docs/project_plans/implementation_plans/features/ica-codex-responses-shim-v1.md. Prior (2026-07-09): Codex gpt-5.6 line added; code_review chain → codex/gpt-5.6-terra; gpt-5.5/-pro demoted. Effort ladder Light|Medium|High|Extra High(=low|medium|high|xhigh) + Ultra(=ultra, Sol/Terra only). ICA Sonnet 5 reasoning caveat. Prior (2026-07-08): ICA serves Sonnet 5 (claude-sonnet-5[1m]=1M) + [1m] preference extends to Gemini.

# ──────────────────────────────────────────────────────────────────────────────
# Task-class → ordered preference chain. The chain IS the priority / free-first
# mapping: entries are "provider/model_id", tried top-down. Free-eligible classes
# start at a free ICA instance; orchestration / mode_d pin to primary Claude.
# ──────────────────────────────────────────────────────────────────────────────
routing_policy:
  exploration:      { chain: ["ica/claude-haiku-4-5", "claude/claude-haiku-4-5"], enabled: true }
  documentation:    { chain: ["ica/claude-haiku-4-5", "claude/claude-haiku-4-5"], enabled: true }
  mechanical:       { chain: ["ica/claude-haiku-4-5", "ica/gemma-4-26b-a4b-it", "claude/claude-haiku-4-5"], enabled: true }
  # Grounded 2026-07-28 (pilot; rf_run_20260728_pilot_re_eval_second_opinion_routing), see use-case-rankings.yaml, conf 0.6. gpt-5.6-sol = escalation-only (disagreement at terra tier).
  second_opinion:   { chain: ["codex/gpt-5.6-terra", "ica/gemini-3.6-flash[1m]", "ica/gemma-4-26b-a4b-it", "ica/claude-haiku-4-5"], enabled: true }
  # Grounded 2026-08-09 (execution pilot, n=3; see use-case-rankings.yaml `agentic-coding`, conf 0.5). CHAIN DELIBERATELY UNCHANGED — codex/gpt-5.6-terra shipped 3/3 real legs with zero logic defects but is EXPLICITLY-SELECTABLE ONLY, not an auto leg, on n=3 with no head-to-head arm. Explicit selection already resolves (codex-executor, fallback claude/claude-sonnet-5) and needs no chain edit. ⚠️ Dispatch an implementer leg at effort `high` — sandboxModeFor() maps standard→read-only, so a default-effort codex implementer CANNOT WRITE and fails by producing nothing.
  implementation:   { chain: ["claude/claude-sonnet-5"], enabled: true }   # workhorse default; ICA claude-sonnet-5[1m] = explicit opt-in free-offload for bounded waves (shared pool, behind reviewer gate; supersedes the older ICA Sonnet 4.6 offload)
  web_research:     { chain: ["gemini/gemini-3.6-flash", "gemini/gemini-3.5-flash", "ica/gemini-3.1-pro-preview[1m]"], enabled: true }   # leg1 native = 3.6-flash Google-Search GROUNDED (newer default, 2026-07-27; needs GEMINI_API_KEY in ~/.config/aos/secrets.env). leg2 = 3.5-flash native (grounded fallback). leg3 ICA = DEGRADED ungrounded fallback (proxy can't ground). Free model-agnostic web lane = aos-web (SearXNG) — prefer for plain search; this chain = fused search+reason.
  code_review:      { chain: ["codex/gpt-5.6-terra", "claude/claude-sonnet-5"], enabled: true }   # codex workhorse = gpt-5.6-terra (successor to gpt-5.5); escalate to gpt-5.6-sol (frontier SOTA) on two failures per the two-failure rule. (An ICA gpt-5.6-terra-dzus lane was attempted 2026-07-20 but reverted — model not reliably servable on the gateway; see ica-codex-responses-shim-v1.md.)
  image_generation: { chain: ["nano-banana/nano-banana-2", "nano-banana/nano-banana-pro"], enabled: true }
  # Grounded 2026-07-28 (pilot; rf_run_20260728_pilot_re_eval_svg_generation_routing), see use-case-rankings.yaml, conf 0.6. Cost/taste trade: frontier leg-1 (claude-fable-5) for final/taste-critical assets, flash tier for drafts/bulk.
  svg_generation:   { chain: ["claude/claude-fable-5", "ica/gemini-3.1-pro-preview[1m]", "gemini/gemini-3.5-flash", "gemini/gemini-3.6-flash"], enabled: true }
  video_generation: { chain: ["sora/sora-2"], enabled: true }
  orchestration:    { chain: ["claude/claude-opus-5"] }   # MUST-stay (spine; Opus 5 supersedes Opus 4.8 2026-07-24)
  mode_d:           { chain: ["claude/claude-opus-5"] }   # MUST-stay (spine; Opus 5 supersedes Opus 4.8 2026-07-24)

# Invariant: these classes can never be routed off primary Claude, regardless of
# registry state. Enforced unconditionally by the resolver MUST-stay override.
must_stay_primary: [orchestration, verdict, mode_d, council_review, synthesis]

