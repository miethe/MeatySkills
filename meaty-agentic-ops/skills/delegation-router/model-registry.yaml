  nvidia/llama-3.3-nemotron-super:
    family: nvidia
    class: nemotron
    descriptor: "NVIDIA Llama 3.3 Nemotron Super 49B (v1.5 served) on the ICA ccx gateway — discovered and bench-evaluated 2026-10-07 (node_01M4C0PWMG1922F4HQ0TPWZVTG; probe+bench receipt docs/project_plans/reports/model-eval/nemotron-super-2026-10-07/ in agentic_meta_dev). Wire id: bare `nvidia/llama-3.3-nemotron-super` ([1m] suffix 403s). Context window: 131,072 tokens. Economics: FREE (x-litellm-response-cost-original: 0.0). Always-on thinking: the model cannot suppress its chain-of-thought — it always emits reasoning before answering, and on complex tasks the thinking trace leaks into text output (bench T2: leaked ~500-token reasoning trace instead of a clean single-word answer). Tool-use: the model responds to tool declarations but uses a custom <TOOLCALL> XML format, NOT standard Anthropic tool_use blocks or OpenAI function_call/tool_calls — incompatible with AOS infrastructure. Latency: avg ~6s (vs Haiku ~1.8s, GPT-luna ~2.7s) due to always-on thinking. Transport: both /chat/completions (OpenAI-compatible) and /v1/messages (Anthropic-compatible) return 200 on bare id. Bench verdict: correct on extraction/code-fix/summarization/JSON-schema tasks; format failure on classification (T2); registered not routed. Positioning bench 2026-10-07 (node_01M4C58QYW0KP7987JWADP8YKV): earns NO role. The Codex harness rejected it (400, so no agentic arm), it returned empty text on a 102K-token retrieval, and two of five short tasks failed format (an empty triage reply, an unparseable schema reply). It was also the slowest arm (24-44 s). AA Intelligence Index ~9 (estimated; AA marks it deprecated)."
    scores: { cost: 10, intelligence: 5, taste: 3, speed: 4 }   # cost=10 (free, same as Haiku/Luna/Gemma); intelligence=5 (Haiku-tier accuracy, format failures on judgment tasks); taste=3 (thinking traces leak into output, verbose, inconsistent format); speed=4 (avg ~6s, slower than all baselines due to always-on thinking)
    when_to_use: []   # not routed to any task class; explicitly selectable only; see MODEL-ROUTING.md
    tools: []
    related_skills: [ica-delegate]
