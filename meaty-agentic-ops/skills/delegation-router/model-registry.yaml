# ──────────────────────────────────────────────────────────────────────────────
# TASK-CLASS DEFAULTS — registry v2 (2026-10-08, routing M1, node_01M4C696HR9WVV6BVZ2FXQZH0Y;
# plan agentic_meta_dev docs/project_plans/implementation_plans/routing-mechanization-v1.md, layer 2).
#
# This block is the AUTHORITY for "which model holds which task class by default". Models hold ROLES
# chosen by evaluation, not rungs on a price ladder; price enters only at layer 3 (margin rule, M2).
#   holders                role holders in preference order ("provider/model_id"; until M2's lane
#                          layer a holder names the lane it holds the role on). resolver.js walks
#                          these first; `routing_policy` below is now a DERIVED copy for older readers
#                          and the builder refuses a registry where the two disagree.
#   effort                 default effort (low|medium|high|xhigh|max). Recorded on the RoutingRecord's
#                          class_default trail; the caller's effort still wins until M5 consumes it.
#   bar                    q_min on the 1-10 class quality scale. q = w_intelligence*I + w_taste*T +
#                          w_speed*S from the model's `scores` (or class_scores, once an evaluation
#                          writes them). The resolver SKIPS a holder whose measured q < bar and records
#                          it; a holder with an UNMEASURED weighted score is never gated (unmeasured).
#   quality                class weights for q (sum to 1).
#   margin.lambda          quality points given up per cost point gained (M2 margin rule; recorded, not
#                          yet applied). Registry-wide default: margin_policy.lambda_default.
#   frontier               required:true = the margin rule may never trade quality away (lambda forced
#                          to 0); holder = the explicit-override frontier pick. Fable and Astra stay
#                          explicit opt-in (MODEL-ROUTING §1.5): never auto-selected via `frontier`.
#   requires_capabilities  HCR capability ids (dotted) or model `capabilities` keys (M3 filters on it).
#   set_by                 evidence (path under the skill dir), node, date, approver, fingerprint.
#
# CHANGING A DEFAULT: edit the entry, run `python3 scripts/build-model-registry.py --in model-registry.yaml
# --stamp` to print its new fingerprint, and write that fingerprint + the class id into an evidence file
# (an evaluation report summary, or Nick's recorded decision). build-model-registry.py REFUSES a registry
# whose entry fingerprint is not recorded in an existing evidence file — a defaults change without
# evidence cannot build, so it cannot deploy. Nick approves the PR: defaults are policy.
# The L4 model-release reconciliation procedure makes "evaluate on the discriminating bench -> defaults
# diff, or a recorded no-change" a mandatory step for every new model family (agentic_meta_dev MODEL-ROUTING §6c).
# ──────────────────────────────────────────────────────────────────────────────
