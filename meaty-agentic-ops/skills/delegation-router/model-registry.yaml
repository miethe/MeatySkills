task_class_sovereignty:
  orchestration:    { min_rung: subscription, reason: quality_bar, set_by: nick, set_on: 2026-08-25 }
  verdict:          { min_rung: subscription, reason: quality_bar, set_by: nick, set_on: 2026-08-25 }
  mode_d:           { min_rung: subscription, reason: quality_bar, set_by: nick, set_on: 2026-08-25 }
  council_review:   { min_rung: subscription, reason: quality_bar, set_by: nick, set_on: 2026-08-25 }
  synthesis:        { min_rung: subscription, reason: quality_bar, set_by: nick, set_on: 2026-08-25 }
  schema_recovery:  { min_rung: subscription, reason: quality_bar, set_by: nick, set_on: 2026-08-25 }
  cross_wave_merge: { min_rung: subscription, reason: quality_bar, set_by: nick, set_on: 2026-08-25 }
  # ⚠️ NO WRITER TODAY — declared so `egress_absolute` is not a paper reason class with no
  # instance in the real registry. Metis's private-journal reflect lane is a launchd single-shot
  # that does NOT currently resolve through delegation-router, so nothing writes this class here
  # (`.claude/rules/built-lane-no-writers.md` — naming the absent writer rather than discovering
  # it later). It is DELIBERATELY UNROUTABLE while the `local` rung has zero members: the
  # resolver refuses rather than dropping a rung, which for an egress rule is the correct
  # outcome. If the journal lane is ever routed through here, provision a local lane first —
  # never relax this minimum. Rule: .claude/rules/metis-journal.md § Egress — absolute.
  journal_reflect:  { min_rung: local, reason: egress_absolute, set_by: nick, set_on: 2026-08-25 }

