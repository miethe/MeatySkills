  claude-haiku-5-5:
    family: claude
    class: haiku
    descriptor: "Claude Haiku 5.5 (released 2026-10-07; Claude Code 2.1.293 resolves the `haiku` alias to it). Default CHEAP/MECHANICAL Claude on the subscription lane, superseding claude-haiku-4-5 (Nick, 2026-10-07). Exact API id claude-haiku-5-5 (dateless pinned snapshot); 1M context NATIVE (4.5 was 200k; the `[1m]` suffix is accepted but a no-op), 128K output, adaptive thinking, default effort medium, retirement not before 2027-10-07. Anthropic list price from $0.10/$0.50 per MTok (10x below Haiku 4.5's $1/$5; cache read 10% of input). Positioned by Anthropic for high-volume latency-sensitive classification, extraction and routing. Served on both claude-primary and claude-1x (cc1x) accounts (smoke 2026-10-07). NOT served on ICA: 403 team_model_access_denied on CCx3 for the bare id, [1m] and dated forms, and absent from the gateway /v1/models catalog, so every ICA lane keeps claude-haiku-4-5. Blind bench 2026-10-07 (6 AOS tasks x 6 arms, docs/project_plans/reports/model-eval/haiku-5-5-2026-10-07/results.md): rubric mean 4.33/5 vs Haiku 4.5 3.83, Sonnet 5.5 4.50, gpt-6-luna(low) 5.00; perfect on extraction, classification, bug fix and routing, clean JSON (no fences), exact word-count discipline; weaker on schema fields that need inference (tier) and on a 150-word summary's coverage (n=1 each). Across the six bench tasks Claude Code's list-basis cost was $0.0042 total vs $0.105 for Haiku 4.5 (~25x lower) and $0.081 for Sonnet 5.5 (~20x lower); the per-token price gap is 10x, the rest is fewer thinking tokens. POSITIONING 2026-10-07 (node_01M4C58QYW0KP7987JWADP8YKV; agentic_meta_dev docs/project_plans/reports/model-eval/positioning-2026-10-07/report.md): a PAID PEER of GPT-6 Luna, not a price fallback behind free ICA. OWNS Claude-Code-native subagent work (Explore/exploration, classifiers, hook-side judgment, compaction), triage/routing judgment (blind reasons graded best of five arms, 19/19 on a 12-item policy triage both reps), fast single-call loops, and cheap context scans up to ~160K tokens (8/8 at 161K in 8.6 s). Ties Sonnet 5.5, GPT-6 Luna and ICA 5.6 Luna at the ceiling on three escalating agentic fix tasks and four strict-schema tasks (correctness does not separate them there; Haiku used 5-23K output tokens per agentic task vs Sonnet's 0.6-3.7K). Community, dated 2026-10-07: Terminal-Bench 4.0 33% (Artificial Analysis) / 39.2% (Anthropic) vs GPT-6 Luna 13% / 16.4%; AA Intelligence Index 38 high / 43 max vs Luna 38; AA-Omniscience hallucination 40% vs Luna 77%; AutomationBench-AA 35% vs Luna 53% (AA flags Haiku's as understated by over-refusal). LIMITS: >=300K-token aggregation is unreliable (5/8 on a 464K-token planted-fact read, both reps; Sonnet 5.5 8/8), and prompts over 100K tokens re-price the whole request at 5x ($0.50/$2.50; measured $0.46 list-basis for one 464K-token call). Not a design_judgment/raw_strength/implementation default (Anthropic itself points complex agentic coding at Sonnet/Opus)."
