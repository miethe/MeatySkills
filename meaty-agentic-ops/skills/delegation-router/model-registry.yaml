    descriptor: "Claude Fable 5 (Mythos-class frontier, released 2026-06-09). SOTA agentic coding (SWE-bench Verified 95%, SWE-bench Pro 80%) and long-horizon reasoning; lead over Opus 4.8 grows with task length/complexity. $10/$50 per M = 2× Opus 4.8 — explicit opt-in only, never auto-routed. 1M context, 128K max output."
    scores: { cost: 1, intelligence: 10, taste: 9, speed: 4 }   # 1-10, higher=better; cost = preferred-lane real spend
    when_to_use: [architecture, novel-algorithm-design, greenfield-jumpstart, long-horizon-autonomy, debug-escalation, high-stakes-verdict, deep-reasoning, planning]
    tools: [one_million_context]
    related_skills: []
