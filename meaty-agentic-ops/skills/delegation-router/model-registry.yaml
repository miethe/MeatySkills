  claude-opus-5-5:
    family: claude
    class: opus
    descriptor: "Claude Opus 5.5 (released 2026-09-22) — the AOS SPINE / MUST-stay tier as of 2026-09-22 (orchestration, verdict/adjudication, final synthesis, architecture, mode-d, schema-recovery, cross-wave merge; agentic_meta_dev CLAUDE.md 'Model × provider × effort'), superseding claude-opus-5 (kept selectable as the legacy/fallback chain entry — reconciled node_01M3F4F5G93P21P1WAH565MAYQ 2026-09-27). Exact API ID claude-opus-5-5; Anthropic documents 1M context, 128K maximum output, adaptive thinking always on, and $4/$20 per input/output MTok ($0.20 cache reads). Anthropic reports >30% faster output than Opus 5 and recommends starting most workloads here, escalating to Fable 5.1 after higher-effort Opus 5.5 falls short. Those routing/performance claims are vendor-reported, not locally measured. Harness caveat MEASURED FROM PRIMARY: preserved thinking applies to API accounts created on/after 2026-08-31, so prior Claude context cannot be edited. Forced-tool-choice and thinking-history behavior are UNKNOWN. ICA ccx Claude-Code wrapper smoke 2026-09-24: claude-opus-5-5[1m] rc 0, canonicalModel claude-opus-5-5, contextWindow 1000000; raw-HTTP bare-id behavior was not re-measured. Native availability in this checkout is unmeasured because claude models requires login."
