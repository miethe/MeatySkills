# How to verify this manifest (run from the MeatySkills repo root):
#
# 1. Byte-identity of the three pinned doctrine excerpts vs. their live upstream
#    (requirement 2 of M4 — no output means pass):
#
#      diff meaty-agentic-ops/workflow-sets/v4.1/artifacts/skill/planning/references/plan-doctrine.md \
#           <agentic_meta_dev>/.claude/skills/planning/references/plan-doctrine.md
#      diff meaty-agentic-ops/workflow-sets/v4.1/artifacts/skill/dev-execution/references/execution-doctrine.md \
#           <agentic_meta_dev>/.claude/skills/dev-execution/references/execution-doctrine.md
#      diff meaty-agentic-ops/workflow-sets/v4.1/artifacts/skill/dev-execution/references/gate-risk-classes.md \
#           <agentic_meta_dev>/.claude/skills/dev-execution/references/gate-risk-classes.md
#
#    (replace <agentic_meta_dev> with your local checkout path)
#
# 2. Snapshot currency (the excerpts have not drifted from the v4.1 manifest's own
#    content_hash — a superset check covering all 33 v4.1 members, these three included):
#
#      python3 meaty-agentic-ops/workflow-sets/make-snapshot.py verify v4.1
#      # -> "33/33 members verified in v4.1"
#
# 3. `skill:aos-onboarding` / `skill:skill-dev` provenance_sha currency — confirm the SHA
#    above is still the last commit touching the member's path (run from agentic_meta_dev):
#
#      git log -1 --format=%H -- .claude/skills/aos-onboarding
#      git log -1 --format=%H -- .claude/skills/skill-dev
#
#    A mismatch means the member has moved since this manifest was authored — treat per the
#    stale-vs-pin state in dependency-resolution.md, and refresh this manifest's
#    provenance_sha (never silently keep the old one).
