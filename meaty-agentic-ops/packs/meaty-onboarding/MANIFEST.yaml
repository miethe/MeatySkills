# HAND-AUTHORED — NOT generated by workflow-sets/make-snapshot.py.
#
# Do not confuse this with a workflow-sets/<label>/MANIFEST.yaml file (e.g.
# ../../workflow-sets/v4.1/MANIFEST.yaml) — those carry the header
# "GENERATED by workflow-sets/make-snapshot.py — do not hand-edit" and are frozen,
# hash-verified snapshots. This file is a hand-authored sibling in the same `type:name`
# member-list idiom, for a different kind of group: the onboarding-core member set. It has
# no generator and no `verify` subcommand of its own — see "How to verify this manifest"
# below for the two real, runnable checks that stand in its place.
#
# Governing correction (design spec, Phase 0 Gate C): "The manifest is the pin, not the
# bundle." SkillMeat bundle membership is `type:name` only, with no per-member version field,
# so this manifest — not any bundle/pack metadata — is where currency claims live and are
# checked.

member_group: meaty-onboarding
description: >-
  onboarding-core: the shared member set behind AOS onboarding skills (aos-onboarding today;
  future onboarding skills in sibling repos). Carries the template set's dependency-resolution
  convention, the workflow-doctrine references backing aos-onboarding route W, and the
  harness-portability/support-matrix convention. See README.md for what this group is and is
  not.
created: "2026-08-02"
schema_note: >-
  Each member has an `id` of the form `type:name` and exactly one currency carrier —
  `snapshot:` (+ `snapshot_path:`) XOR `provenance_sha:` — mirroring the shape
  `skill-dev/SPEC.md` §3.1 defines for a skill's own `depends_on:` block. Unlike that block,
  entries here are not read by any validator; they are read by a human or an agent proving
  currency by hand, per "How to verify this manifest" below.

members:
  - id: "skill:aos-onboarding"
    repo: agentic_meta_dev
    upstream_path: .claude/skills/aos-onboarding
    provenance_sha: "80827df"
    note: >-
      NOT a workflow-set-v4.1 member — created 2026-08-02, after the v4.1 snapshot (cut the
      same day, earlier) was frozen. Pinned by commit SHA, the last commit touching this path
      in agentic_meta_dev, because no snapshot exists for it yet. Carries no `snapshot_path`.
      RE-PINNED after merge: this pack was assembled on an unmerged worktree branch, whose
      per-milestone SHAs ceased to exist when the branch was squash-merged and deleted. A pin
      to a commit that has been GC'd cannot distinguish "moved" from "never existed", so the
      pin is the squash-merge commit on `main` (agentic_meta_dev PR #91) — the only SHA for
      this content that is durably reachable.

  - id: "skill:skill-dev"
    repo: agentic_meta_dev
    upstream_path: .claude/skills/skill-dev
    provenance_sha: "80827df"
    note: >-
      DEVIATION FROM THE ORIGINAL ASSIGNMENT, LOGGED HERE AND IN
      .claude/worknotes/onboarding-skills-phase1/implementation-notes.md (agentic_meta_dev):
      skill:skill-dev is NOT a workflow-set-v4.1 member. Checked directly against
      ../../workflow-sets/v4.1/MANIFEST.yaml's `excluded:` block (identical in v3.5's):
      reason "authoring/conformance gate for artifacts — meta-layer, not the plan/execute
      lifecycle." No `snapshot_path` exists for skill-dev in any workflow-set that has ever
      been cut, so one is not fabricated here (the plan's own rubric: "nothing may claim a
      version that nothing produces"). Pinned instead by `provenance_sha` — the last commit
      touching .claude/skills/skill-dev in agentic_meta_dev, which is the squash-merge commit
      of PR #91 on `main` (RE-PINNED after merge; see the aos-onboarding note above for why
      the pre-merge per-milestone SHAs could not be kept). That commit includes M1 (the
      `depends_on` SPEC amendment, SPEC.md now at v1.1, validator check 13), M2 (the two
      onboarding templates under skill-dev/templates/), and the post-gate SPEC §3.1 amendment
      that added `locator:`/`verifier:` — so this provenance_sha is current with today's
      skill-dev, not stale against it. The staleness shape the original
      assignment asked this note to state ("the snapshot copy is older than the live
      upstream") does not apply, because skill-dev has never had a snapshot copy to be older
      than: it is excluded from workflow-set membership by design, not by omission. If a
      future workflow-set ever includes skill-dev, that snapshot will need re-cutting to catch
      up to this provenance_sha (and to whatever supersedes it by then) before it could be
      cited as current — the same caveat, just not yet realized.

  - id: "doctrine:plan-doctrine"
