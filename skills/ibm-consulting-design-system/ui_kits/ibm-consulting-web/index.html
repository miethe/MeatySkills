<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IBM Consulting — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const { useState } = React;

const EXAMPLES = [
  ...["example-one", "example-two", "example-three", "example-four"].map((id, index) => ({
    id,
    eyebrow: `Category ${index + 1}`,
    title: "Service Example",
    body: "Example descriptive copy for a service detail layout.",
    objectives: ["Objective example", "Objective example", "Objective example", "Objective example"],
    tech: ["Technology example", "Technology example", "Technology example"],
    tools: ["Resource example", "Resource example", "Resource example"],
    levers: ["Outcome example", "Outcome example", "Outcome example"],
    pills: ["Category", "Example", "Service"],
    phases: [
      {label: "01 · Phase", body: "Phase body copy", dur: "Duration · scope"},
      {label: "02 · Phase", body: "Phase body copy", dur: "Duration · scope"},
      {label: "03 · Phase", body: "Phase body copy", dur: "Duration · scope"},
    ],
  })),
];

function Home({ go }) {
  return (
    <>
      <HeroBlock
        eyebrow="IBM Consulting · 2026"
        title={<>Let's create<br/>what's next.</>}
        sub="Example service copy for a branded landing page."
        ctaLabel="Explore examples"
        onCta={() => document.getElementById("examples")?.scrollIntoView({behavior:'smooth'})}
      />

      <section className="section" id="examples">
        <div className="eyebrow">What we build</div>
        <h2 className="headline">Four examples engineered for the hybrid-cloud enterprise.</h2>
        <p className="kicker">Use these cards to preview repeated content and component layouts.</p>
        <div className="tiles" style={{marginTop:48}}>
          {EXAMPLES.map((o) => (
            <OfferingCard key={o.id} eyebrow={o.eyebrow} title={o.title} body={o.body}
              onClick={() => go(o.id)} />
          ))}
        </div>
      </section>

      <section className="section" style={{background:"#f4f4f4", maxWidth:"none", padding:"96px 5vw"}}>
        <div style={{maxWidth:1584, margin:"0 auto"}}>
          <div className="eyebrow">Example metrics</div>
          <h2 className="headline">Example metrics for a dashboard layout.</h2>
          <div className="stats" style={{marginTop:48}}>
            <StatBlock num="01"  label="Metric label" sub="Supporting description for this metric." />
            <StatBlock num="02"   label="Metric label"   sub="Supporting description for this metric." />
            <StatBlock num="03" label="Metric label"     sub="Supporting description for this metric." />
          </div>
        </div>
      </section>

      <section className="section">
        <div className="eyebrow">Think</div>
        <h2 className="headline">Perspectives from the practice.</h2>
        <div style={{marginTop:32, maxWidth:880}}>
          <TileLink eyebrow="Point of view · 18 min read">
            Example article title for a content card.
          </TileLink>
          <TileLink eyebrow="Case study · Healthcare">
            Example case study title for a content card.
          </TileLink>
          <TileLink eyebrow="Webinar · 45 min">
            Example webinar title for a content card.
          </TileLink>
          <TileLink eyebrow="Report">
            Example report title for a content card.
          </TileLink>
        </div>
      </section>

      <FooterBar />
    </>
  );
}

function Detail({ offering, go }) {
  const o = offering;
  return (
    <>
      <div className="breadcrumb">
        <a href="#" onClick={(e)=>{e.preventDefault(); go("home");}}>Consulting</a>
        <span className="sep">/</span>
        <span>Hybrid cloud</span>
        <span className="sep">/</span>
        <span style={{color:"#161616"}}>{o.title}</span>
      </div>

      <section className="section" style={{paddingTop:24}}>
        <div className="two-col">
          <div>
            <div className="eyebrow">{o.eyebrow} offering</div>
            <h1 className="headline" style={{fontSize:56, maxWidth:"none"}}>{o.title}</h1>
            <div className="tagrow">
              {o.pills.map((p,i) => <span className="pill" key={i}>{p}</span>)}
            </div>
            <p className="kicker" style={{marginBottom:32, maxWidth:"none"}}>{o.body}</p>
            <Button size="lg" onClick={()=>go("contact")}>Talk to our team</Button>
            <Button kind="ghost" onClick={()=>go("home")}>Back to examples</Button>
          </div>

          <div className="quad">
            <div>
              <h5><img src="../../assets/icons/target.png" alt=""/>Objectives</h5>
              <ul>{o.objectives.map((x,i)=><li key={i}>{x}</li>)}</ul>
            </div>
            <div>
              <h5><img src="../../assets/icons/tools.png" alt=""/>Technology in scope</h5>
              <ul>{o.tech.map((x,i)=><li key={i}>{x}</li>)}</ul>
            </div>
            <div>
              <h5><img src="../../assets/icons/microscope.png" alt=""/>Tools &amp; accelerators</h5>
              <ul>{o.tools.map((x,i)=><li key={i}>{x}</li>)}</ul>
            </div>
            <div style={{background:"#161616",color:"#fff",borderColor:"#161616"}}>
              <h5 style={{color:"#fff"}}><img src="../../assets/icons/rocket.png" alt="" style={{filter:"invert(1)"}}/>Key value levers</h5>
              <ul style={{color:"#e0e0e0"}}>{o.levers.map((x,i)=><li key={i}>{x}</li>)}</ul>
            </div>
          </div>
        </div>
      </section>

      <section className="section" style={{paddingTop:32}}>
        <div className="eyebrow">Example service structure</div>
        <h2 className="headline" style={{fontSize:32}}>Example phase layout.</h2>
        <div className="phases">
          {o.phases.map((p,i) => (
            <div key={i} className={`p${i+1}`}>
              <h6>{p.label}</h6>
              <div style={{lineHeight:1.5,opacity:0.95}}>{p.body}</div>
              <div className="dur">{p.dur}</div>
            </div>
          ))}
        </div>
      </section>

      <FooterBar />
    </>
  );
}

function Contact({ go }) {
  return (
    <>
      <div className="breadcrumb">
        <a href="#" onClick={(e)=>{e.preventDefault(); go("home");}}>Consulting</a>
        <span className="sep">/</span>
        <span style={{color:"#161616"}}>Contact</span>
      </div>
      <section className="section" style={{maxWidth:720, padding:"48px 5vw 120px"}}>
        <div className="eyebrow">Contact form example</div>
        <h1 className="headline">Let's talk about what's next.</h1>
        <p className="kicker">Use this form to demonstrate contact fields and submission states.</p>

        <form onSubmit={(e)=>{e.preventDefault(); alert("Thanks — an IBM Consulting representative will be in touch.");}}
              style={{display:"flex",flexDirection:"column",gap:16,marginTop:32}}>
          <Field label="Full name" placeholder="Alex Chen" />
          <Field label="Work email" placeholder="alex@company.com" />
          <Field label="Company" placeholder="Company name" />
          <Field label="Estate size (VMs / clusters)" placeholder="e.g. 2,400 VMs across 3 vCenters" />
          <Field label="What are you trying to achieve?" placeholder="Short description…" textarea />
          <div style={{marginTop:16}}>
            <Button size="lg">Submit</Button>
            <Button kind="ghost" onClick={()=>go("home")}>Cancel</Button>
          </div>
        </form>
      </section>
      <FooterBar />
    </>
  );
}

function Field({ label, placeholder, textarea }) {
  return (
    <label style={{display:"flex",flexDirection:"column",gap:6,fontFamily:"IBM Plex Sans"}}>
      <span style={{fontSize:12,color:"#525252"}}>{label}</span>
      {textarea
        ? <textarea rows={4} placeholder={placeholder} style={{fontFamily:"inherit",fontSize:14,color:"#161616",background:"#f4f4f4",border:"none",borderBottom:"1px solid #8d8d8d",padding:"11px 16px",resize:"vertical"}}/>
        : <input placeholder={placeholder} style={{fontFamily:"inherit",fontSize:14,color:"#161616",background:"#f4f4f4",border:"none",borderBottom:"1px solid #8d8d8d",padding:"11px 16px"}}/>}
    </label>
  );
}

function App() {
  const [route, setRoute] = useState("home");
  const offering = EXAMPLES.find(o => o.id === route);
  return (
    <>
      <MastheadNav active="Consulting" onNavigate={setRoute} />
      {route === "home"    && <Home go={setRoute} />}
      {offering            && <Detail offering={offering} go={setRoute} />}
      {route === "contact" && <Contact go={setRoute} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
