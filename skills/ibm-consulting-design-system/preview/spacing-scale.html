<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">

    <div style="display:flex;align-items:center;gap:12px"><div class="mono" style="width:80px">space-01</div><div style="background:#0f62fe;height:16px;width:2px"></div><div class="lbl">2px</div></div>
    <div style="display:flex;align-items:center;gap:12px"><div class="mono" style="width:80px">space-02</div><div style="background:#0f62fe;height:16px;width:4px"></div><div class="lbl">4px</div></div>
