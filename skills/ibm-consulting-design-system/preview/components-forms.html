<!doctype html>
<html><head><meta charset="utf-8"><title>Form Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .field { display:flex; flex-direction:column; gap:6px; font-family:'IBM Plex Sans',sans-serif; }
  .field label { font-size:12px; color:#525252; }
  .field input, .field select, .field textarea {
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    color:#161616;
    background:#f4f4f4;
    border:none;
    border-bottom:1px solid #8d8d8d;
    padding:11px 16px;
    border-radius:0;
    outline:none;
  }
  .field input:focus { outline: 2px solid #0f62fe; outline-offset:-2px; }
  .field .helper { font-size:12px; color:#6f6f6f; }
  .field--invalid input { border-bottom-color:#da1e28; outline: 2px solid #da1e28; outline-offset:-2px; }
  .field--invalid .helper { color:#da1e28 }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="gap:16px">
    <div class="field" style="flex:1"><label>Email address</label><input value="nick.miethe@ibm.com"></div>
    <div class="field" style="flex:1"><label>Company</label><input placeholder="Enter company name"></div>
  </div>
  <div class="row" style="gap:16px">
    <div class="field" style="flex:1"><label>Engagement scope</label>
      <select><option>Assessment · 2–4 weeks</option></select>
    </div>
    <div class="field field--invalid" style="flex:1"><label>Budget (USD)</label>
      <input value="-100">
      <div class="helper">Enter a positive value above $50K.</div>
    </div>
  </div>
  <div class="lbl">Inputs sit on a Gray 10 background with a 1px Gray 50 underline — Carbon's "fluid" text field. Focus = 2px IBM Blue outline, inset. Error = Red 60.</div>
</div>
</body></html>
