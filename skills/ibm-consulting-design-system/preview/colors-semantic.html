<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic Colors</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="col">
    <div class="row">
      <div class="swatch swatch--on-dark" style="background:#da1e28;flex:1"><span class="name">Error</span><span class="hex">#da1e28 · Red 60</span></div>
      <div class="swatch swatch--on-dark" style="background:#198038;flex:1"><span class="name">Success</span><span class="hex">#198038 · Green 60</span></div>
      <div class="swatch" style="background:#f1c21b;flex:1"><span class="name">Warning</span><span class="hex">#f1c21b · Yellow 30</span></div>
      <div class="swatch swatch--on-dark" style="background:#0043ce;flex:1"><span class="name">Info</span><span class="hex">#0043ce · Blue 70</span></div>
    </div>
    <div class="row" style="gap:0;border-top:1px solid #e0e0e0;padding-top:12px">
      <div style="flex:1;padding:8px 12px;background:#fff1f1;border-left:3px solid #da1e28;font-size:12px">Error message — inline</div>
      <div style="flex:1;padding:8px 12px;background:#defbe6;border-left:3px solid #198038;font-size:12px">Success confirmed</div>
      <div style="flex:1;padding:8px 12px;background:#fcf4d6;border-left:3px solid #f1c21b;font-size:12px">Warning notice</div>
      <div style="flex:1;padding:8px 12px;background:#edf5ff;border-left:3px solid #0043ce;font-size:12px">Informational</div>
    </div>
  </div>
  <div class="lbl">Carbon status colors. Inline notifications use a 3px left-rule + tinted background at the "10" shade — IBM's standard alert pattern.</div>
</div>
</body></html>
