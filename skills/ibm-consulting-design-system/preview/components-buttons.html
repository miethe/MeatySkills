<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 18px;
    padding: 11px 60px 11px 16px;
    border: 1px solid transparent;
    background: #0f62fe;
    color: #fff;
    cursor: pointer;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 70ms cubic-bezier(0.2,0,0.38,0.9);
    border-radius: 0;
    position: relative;
  }
  .btn--secondary { background:#393939; color:#fff }
  .btn--tertiary  { background:transparent; color:#0f62fe; border-color:#0f62fe }
  .btn--ghost     { background:transparent; color:#0f62fe }
  .btn--danger    { background:#da1e28; color:#fff }
  .btn svg { width: 16px; height: 16px; }
  .btn--sm { padding: 7px 60px 7px 12px; font-size:14px }
  .btn--lg { padding: 15px 60px 15px 16px; font-size:16px }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="gap:1px;background:#e0e0e0">
    <button class="btn">Primary <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 8L6 2.5v11z"/></svg></button>
    <button class="btn btn--secondary">Secondary <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 8L6 2.5v11z"/></svg></button>
    <button class="btn btn--tertiary">Tertiary <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 8L6 2.5v11z"/></svg></button>
    <button class="btn btn--ghost">Ghost</button>
    <button class="btn btn--danger">Danger <svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 8L6 2.5v11z"/></svg></button>
  </div>
  <div class="row" style="gap:8px;align-items:flex-end">
    <button class="btn btn--sm">Small</button>
    <button class="btn">Default</button>
    <button class="btn btn--lg">Large · productive</button>
  </div>
  <div class="lbl">Carbon buttons are rectangular, flush-left label with trailing icon, zero radius. Chained primary/secondary sit 1px apart with a Gray 20 seam, never gap.</div>
</div>
</body></html>
