<!doctype html>
<html><head><meta charset="utf-8"><title>Background Treatments</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card card--flush" style="border:0;background:transparent">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 1px;">
    <div style="background:#ffffff;height:120px;border:1px solid #e0e0e0;display:flex;align-items:flex-end;padding:12px"><span class="mono">#ffffff · product</span></div>
    <div style="background:#f4f4f4;height:120px;border:1px solid #e0e0e0;display:flex;align-items:flex-end;padding:12px"><span class="mono">#f4f4f4 · subtle layer</span></div>
    <div style="background:linear-gradient(135deg,#0f62fe,#002d9c);height:120px;display:flex;align-items:flex-end;padding:12px"><span class="mono" style="color:#fff">blue hero · marketing</span></div>
    <div style="background:#161616;height:120px;display:flex;align-items:flex-end;padding:12px"><span class="mono" style="color:#f4f4f4">#161616 · g100 theme</span></div>
  </div>
  <div class="lbl" style="background:#fff;padding:14px;border-top:0">Four background registers. Product UI stays white or Gray 10. Deep blue is reserved for deck covers and hero sections. Gray 100 is the Carbon "g100" dark theme.</div>
</div>
</body></html>
