<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:16px;align-items:flex-end">
    <div class="col" style="gap:8px;align-items:center">
      <div style="width:96px;height:96px;background:#f4f4f4;border:1px solid #e0e0e0;border-radius:0"></div>
      <div class="mono">radius-0 · 0px</div>
      <div class="lbl">Default — cards, buttons, modals</div>
    </div>
    <div class="col" style="gap:8px;align-items:center">
      <div style="width:96px;height:96px;background:#f4f4f4;border:1px solid #e0e0e0;border-radius:2px"></div>
      <div class="mono">radius-sm · 2px</div>
      <div class="lbl">Inputs, tags</div>
    </div>
    <div class="col" style="gap:8px;align-items:center">
      <div style="width:96px;height:96px;background:#f4f4f4;border:1px solid #e0e0e0;border-radius:4px"></div>
      <div class="mono">radius-md · 4px</div>
      <div class="lbl">Marketing only — never in product UI</div>
    </div>
    <div class="col" style="gap:8px;align-items:center">
      <div style="width:96px;height:96px;background:#fff1f1;border:2px dashed #da1e28;display:flex;align-items:center;justify-content:center;font-size:32px;color:#da1e28">✕</div>
      <div class="mono" style="color:#da1e28">8px+</div>
      <div class="lbl" style="color:#da1e28">Never — reads as consumer, not IBM</div>
    </div>
  </div>
  <div class="lbl">Carbon is emphatically square. Rounded corners past 4px break IBM's visual DNA.</div>
</div>
</body></html>
