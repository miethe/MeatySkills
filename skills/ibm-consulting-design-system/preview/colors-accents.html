<!doctype html>
<html><head><meta charset="utf-8"><title>Accent Colors</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="grid" style="grid-template-columns: repeat(5, 1fr); gap: 0;">
    <div class="swatch swatch--on-dark" style="background:#a56eff"><span class="name">Purple 60</span><span class="hex">#a56eff</span></div>
    <div class="swatch swatch--on-dark" style="background:#009d9a"><span class="name">Teal 60</span><span class="hex">#009d9a</span></div>
    <div class="swatch swatch--on-dark" style="background:#9f1853"><span class="name">Magenta 70</span><span class="hex">#9f1853</span></div>
    <div class="swatch swatch--on-dark" style="background:#1192e8"><span class="name">Cyan 50</span><span class="hex">#1192e8</span></div>
    <div class="swatch swatch--on-dark" style="background:#003a6d"><span class="name">Navy</span><span class="hex">#003a6d</span></div>
  </div>
  <div class="lbl">Supporting accents from the deck theme — used for data viz, category chips, and editorial moments. Never lead a UI with them; Blue 60 is the primary.</div>
</div>
</body></html>
