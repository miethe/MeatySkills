<!doctype html>
<html><head><meta charset="utf-8"><title>Carbon Gray Scale</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="grid" style="grid-template-columns: repeat(6, 1fr); gap: 0;">
    <div class="swatch swatch--on-dark" style="background:#161616"><span class="name">Gray 100</span><span class="hex">#161616</span></div>
    <div class="swatch swatch--on-dark" style="background:#262626"><span class="name">Gray 90</span><span class="hex">#262626</span></div>
    <div class="swatch swatch--on-dark" style="background:#393939"><span class="name">Gray 80</span><span class="hex">#393939</span></div>
    <div class="swatch swatch--on-dark" style="background:#525252"><span class="name">Gray 70</span><span class="hex">#525252</span></div>
    <div class="swatch swatch--on-dark" style="background:#6f6f6f"><span class="name">Gray 60</span><span class="hex">#6f6f6f</span></div>
    <div class="swatch swatch--on-dark" style="background:#8d8d8d"><span class="name">Gray 50</span><span class="hex">#8d8d8d</span></div>
    <div class="swatch" style="background:#a8a8a8"><span class="name">Gray 40</span><span class="hex">#a8a8a8</span></div>
    <div class="swatch" style="background:#c6c6c6"><span class="name">Gray 30</span><span class="hex">#c6c6c6</span></div>
    <div class="swatch" style="background:#e0e0e0"><span class="name">Gray 20</span><span class="hex">#e0e0e0</span></div>
    <div class="swatch" style="background:#f4f4f4"><span class="name">Gray 10</span><span class="hex">#f4f4f4</span></div>
    <div class="swatch" style="background:#ffffff;border:1px solid #e0e0e0"><span class="name">White</span><span class="hex">#ffffff</span></div>
    <div class="swatch swatch--on-dark" style="background:#000000"><span class="name">Black</span><span class="hex">#000000</span></div>
  </div>
  <div class="lbl">Carbon's 10-step neutral scale — the backbone of every IBM UI. Body text sits at Gray 100 (#161616), not pure black.</div>
</div>
</body></html>
