<!doctype html>
<html><head><meta charset="utf-8"><title>Carbon Blue Scale</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="grid" style="grid-template-columns: repeat(5, 1fr); gap: 0;">
    <div class="swatch swatch--on-dark" style="background:#001141"><span class="name">Blue 100</span><span class="hex">#001141</span></div>
    <div class="swatch swatch--on-dark" style="background:#001d6c"><span class="name">Blue 90</span><span class="hex">#001d6c</span></div>
    <div class="swatch swatch--on-dark" style="background:#002d9c"><span class="name">Blue 80</span><span class="hex">#002d9c</span></div>
    <div class="swatch swatch--on-dark" style="background:#0043ce"><span class="name">Blue 70</span><span class="hex">#0043ce</span></div>
    <div class="swatch swatch--on-dark" style="background:#0f62fe;outline:2px solid #0f62fe;outline-offset:-3px;outline-style:dashed"><span class="name">Blue 60 ★</span><span class="hex">#0f62fe</span></div>
    <div class="swatch swatch--on-dark" style="background:#4589ff"><span class="name">Blue 50</span><span class="hex">#4589ff</span></div>
    <div class="swatch" style="background:#78a9ff"><span class="name">Blue 40</span><span class="hex">#78a9ff</span></div>
    <div class="swatch" style="background:#a6c8ff"><span class="name">Blue 30</span><span class="hex">#a6c8ff</span></div>
    <div class="swatch" style="background:#d0e2ff"><span class="name">Blue 20</span><span class="hex">#d0e2ff</span></div>
    <div class="swatch" style="background:#edf5ff"><span class="name">Blue 10</span><span class="hex">#edf5ff</span></div>
  </div>
  <div class="lbl">IBM's signature hue. <strong>Blue 60 <span class="mono">#0f62fe</span></strong> is THE IBM Blue — links, primary buttons, focus rings. Blue 70/80 power dark hero backgrounds.</div>
</div>
</body></html>
