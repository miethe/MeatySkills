<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows & Elevation</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#f4f4f4">
  <div class="row" style="gap:20px;padding:24px 0;justify-content:space-around">
    <div class="col" style="gap:10px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;border:1px solid #e0e0e0"></div>
      <div class="mono">border only</div>
      <div class="lbl">Default card</div>
    </div>
    <div class="col" style="gap:10px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.08)"></div>
      <div class="mono">shadow-xs</div>
      <div class="lbl">Subtle lift</div>
    </div>
    <div class="col" style="gap:10px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.20)"></div>
      <div class="mono">overlay</div>
      <div class="lbl">Menus, popovers</div>
    </div>
    <div class="col" style="gap:10px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.10)"></div>
      <div class="mono">shadow-md</div>
      <div class="lbl">Marketing cards</div>
    </div>
  </div>
  <div class="lbl" style="background:#fff;padding:12px;margin:-12px -12px -12px">Carbon prefers borders over shadow. Most interior UI uses no shadow at all — just a 1px Gray 20 rule.</div>
</div>
</body></html>
