<!doctype html>
<html><head><meta charset="utf-8"><title>IBM Logo</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:1px;background:#e0e0e0;align-items:stretch">
    <div style="flex:1;background:#fff;padding:24px;display:flex;align-items:center;justify-content:center;min-height:100px">
      <img src="../assets/logos/ibm-logo-blue-white-bg.png" style="height:44px;display:block" alt="IBM blue on white">
    </div>
    <div style="flex:1;background:#f4f4f4;padding:24px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/logos/ibm-logo-black-white-bg.png" style="height:44px;display:block" alt="IBM black on gray">
    </div>
    <div style="flex:1;background:#0f62fe;padding:24px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/logos/ibm-logo-white.png" style="height:44px;display:block;filter:invert(1)" alt="IBM white on blue">
    </div>
    <div style="flex:1;background:#161616;padding:24px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/logos/ibm-logo-white.png" style="height:44px;display:block;filter:invert(1)" alt="IBM white on black">
    </div>
  </div>
  <div class="lbl">The 8-bar IBM® wordmark. Blue is primary; black for print; white on any dark surface ≥ Blue 70. Clearspace = height of one bar on every side.</div>
</div>
</body></html>
