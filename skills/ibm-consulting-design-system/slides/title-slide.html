<!doctype html>
<html><head><meta charset="utf-8"><title>Title Slide</title>
<link rel="stylesheet" href="_slide.css">
</head>
<body>
<div class="slide" style="background:#0f62fe">
  <!-- Subtle sculptural background imagery, IBM consulting brand motif -->
  <img src="../assets/backgrounds/ibm-sculpt-e-blue.jpg"
       style="position:absolute;right:0;top:0;height:100%;width:55%;object-fit:cover;opacity:0.7">
  <div style="position:absolute;right:0;top:0;width:55%;height:100%;background:linear-gradient(90deg,#0f62fe 0%,rgba(15,98,254,0.2) 40%, rgba(15,98,254,0) 100%)"></div>

  <img src="../assets/logos/ibm-logo-white.png" class="slide-logo"
       style="filter:invert(1);height:32px;top:32px;left:48px;right:auto">

  <div style="position:absolute;left:48px;bottom:80px;max-width:720px;color:#fff">
    <div style="font-size:14px;letter-spacing:0;margin-bottom:24px;font-weight:400;display:flex;align-items:center;gap:10px">
      <span style="display:inline-block;width:24px;height:2px;background:#fff"></span>
      IBM Consulting · 2026 Strategy
    </div>
    <div style="font-family:'IBM Plex Sans';font-size:84px;line-height:1.02;font-weight:300;letter-spacing:-0.015em;margin-bottom:20px">
      Let's create<br>what's next.
    </div>
    <div style="font-size:20px;font-weight:300;line-height:1.4;max-width:560px;opacity:0.95">
      Hybrid cloud, automation, and agentic AI — delivered at enterprise scale with IBM Consulting and BoxBoat.
    </div>
  </div>

  <div class="slide-footer" style="color:rgba(255,255,255,0.7);left:48px;right:48px">
    <span>IBM Consulting</span>
    <span>March 2026</span>
  </div>
</div>
</body></html>
